<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Details</title>

  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #121210;
      --grid-line: rgba(201, 162, 75, 0.035);
      --surface: #191915;
      --line: #29291f;
      --line-strong: #3c3b2e;
      --paper: #ece7dc;
      --paper-dim: #9a9689;
      --paper-faint: #6c6a5f;

      --design: #c9a24b;
      --urban-design: #6f92b0;
      --planning: #8a9a6b;
      --executive: #b06a4f;

      --cat-color: var(--design);
    }

    html[lang="ar"] body,
    body.rtl {
      font-family: "IBM Plex Sans Arabic", "IBM Plex Sans", sans-serif;
    }

    body {
      font-family: "IBM Plex Sans", sans-serif;
      padding: 6% 8% 10%;
      background: var(--bg);
      color: var(--paper);
      background-image:
        linear-gradient(var(--grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
      background-size: 48px 48px;
    }

    .container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 48px;
      align-items: center;
      margin-bottom: 0;
    }
    @media (max-width: 900px) { .container { grid-template-columns: 1fr; } }

    a.back-link {
      color: var(--paper-dim);
      font-size: 0.88rem;
      text-decoration: none;
      display: inline-block;
      margin-bottom: 28px;
      border-bottom: 1px solid var(--line-strong);
      padding-bottom: 3px;
      transition: color 0.2s ease, border-color 0.2s ease;
    }
    a.back-link:hover { color: var(--cat-color); border-color: var(--cat-color); }

    .meta-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .meta-code {
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--cat-color);
    }
    .meta-cat {
      font-size: 0.82rem;
      color: var(--paper-dim);
    }

    h1 { font-size: clamp(1.8rem, 3.2vw, 2.4rem); font-weight: 400; margin-bottom: 18px; color: #fff; line-height: 1.25; }
    #project-desc { color: var(--paper-dim); margin-bottom: 0; line-height: 1.65; max-width: 56ch; }

    .viewer-wrapper {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--line);
    }
    model-viewer { width: 100%; height: 460px; display: block; --poster-color: transparent; }
    .viewer-placeholder {
      height: 460px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px;
      color: var(--paper-dim);
      font-size: 0.92rem;
      line-height: 1.7;
    }
    .viewer-hint {
      padding: 10px 16px;
      font-size: 0.8rem;
      color: var(--paper-faint);
      border-top: 1px solid var(--line);
    }

    /* Title block — modelled on the info strip found on real architectural drawing sheets */
    .title-block {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border: 1px solid var(--line);
      border-top: 2px solid var(--cat-color);
      margin: 48px 0 0;
    }
    .tb-cell {
      padding: 16px 22px;
      border-inline-start: 1px solid var(--line);
    }
    .tb-cell:first-child { border-inline-start: none; }
    @media (max-width: 700px) {
      .title-block { grid-template-columns: 1fr; }
      .tb-cell { border-inline-start: none; border-top: 1px solid var(--line); }
      .tb-cell:first-child { border-top: none; }
    }
    .tb-label {
      display: block;
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--paper-faint);
      margin-bottom: 6px;
    }
    .tb-value {
      display: block;
      font-size: 0.95rem;
      color: var(--paper);
      font-weight: 500;
    }

    .gallery-heading {
      font-size: 1.3rem;
      font-weight: 300;
      margin-bottom: 24px;
      border-top: 1px solid var(--line);
      padding-top: 44px;
      margin-top: 56px;
      color: #fff;
    }
    .image-gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 32px; }
    @media (max-width: 500px) { .image-gallery { grid-template-columns: 1fr; } }

    .gallery-item {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--line);
      padding: 10px;
      cursor: pointer;
      transition: border-color 0.25s ease;
    }
    .gallery-item:hover { border-color: var(--cat-color); }
    .gallery-item img { width: 100%; height: auto; display: block; }
    .image-caption { font-size: 0.85rem; color: var(--paper-faint); margin-top: 10px; text-align: center; }

    .corner { position: absolute; width: 14px; height: 14px; opacity: 0; transition: opacity 0.25s ease, transform 0.25s ease; }
    .corner-tl { top: 6px; left: 6px; border-top: 2px solid var(--cat-color); border-left: 2px solid var(--cat-color); transform: translate(3px, 3px); }
    .corner-tr { top: 6px; right: 6px; border-top: 2px solid var(--cat-color); border-right: 2px solid var(--cat-color); transform: translate(-3px, 3px); }
    .corner-bl { bottom: 6px; left: 6px; border-bottom: 2px solid var(--cat-color); border-left: 2px solid var(--cat-color); transform: translate(3px, -3px); }
    .corner-br { bottom: 6px; right: 6px; border-bottom: 2px solid var(--cat-color); border-right: 2px solid var(--cat-color); transform: translate(-3px, -3px); }
    .gallery-item:hover .corner { opacity: 1; transform: translate(0, 0); }

    /* Fullscreen Modal Lightbox Core Layout */
    .lightbox {
      display: none; position: fixed; z-index: 9999; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(9, 9, 8, 0.98); justify-content: center; align-items: center; user-select: none;
    }

    .lightbox-content {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .img-container {
      overflow: hidden;
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .lightbox-img {
      max-width: 100%; max-height: 82vh; object-fit: contain;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7); transition: transform 0.15s ease-out; transform-origin: center center;
      cursor: grab;
    }

    .lightbox-caption {
      color: var(--paper-dim);
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.95rem;
      text-align: center;
      z-index: 10003;
      background: var(--surface);
      border: 1px solid var(--line);
      padding: 8px 18px;
    }

    .close-btn { position: absolute; top: 30px; right: 40px; color: var(--paper); font-size: 36px; font-weight: 300; cursor: pointer; z-index: 10004; transition: color 0.2s ease; }
    .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); color: var(--paper); font-size: 44px; padding: 20px; cursor: pointer; z-index: 10004; transition: color 0.2s ease; }
    .nav-btn:hover, .close-btn:hover { color: var(--cat-color); }
    .prev-btn { left: 20px; }
    .next-btn { right: 20px; }

    /* Blocking loading screen — shown until the 3D model + all gallery images are ready */
    html, body { overscroll-behavior-y: contain; }
    body.loading { overflow: hidden; height: 100vh; }

    #page-loader {
      position: fixed;
      inset: 0;
      z-index: 100000;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      touch-action: none;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    #page-loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .loader-mark {
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--paper-faint);
    }
    .loader-percent {
      font-size: 2.6rem;
      font-weight: 300;
      color: #fff;
      font-variant-numeric: tabular-nums;
    }
    .loader-bar-track {
      width: 220px;
      height: 2px;
      background: var(--line);
      position: relative;
      overflow: hidden;
    }
    .loader-bar-fill {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 0%;
      background: var(--cat-color);
      transition: width 0.2s ease;
    }
  </style>
</head>
<body class="loading">

  <div id="page-loader">
    <span class="loader-mark" id="loader-label">Loading Project</span>
    <span class="loader-percent" id="loader-percent">0%</span>
    <div class="loader-bar-track"><div class="loader-bar-fill" id="loader-bar"></div></div>
  </div>

  <div class="container">
    <div>
      <a href="index.html" class="back-link" id="back-btn">← Back to Portfolio</a>
      <div class="meta-row">
        <span class="meta-code" id="project-code"></span>
        <span class="meta-cat" id="project-category"></span>
      </div>
      <h1 id="project-title">Loading...</h1>
      <p id="project-desc"></p>
    </div>
    <div class="viewer-wrapper" id="viewer-container">
      <p class="viewer-hint" id="viewer-hint">Drag to rotate, scroll to zoom.</p>
    </div>
  </div>

  <div class="title-block" id="title-block">
    <div class="tb-cell">
      <span class="tb-label" id="tb-label-project">Project</span>
      <span class="tb-value" id="tb-project"></span>
    </div>
    <div class="tb-cell">
      <span class="tb-label" id="tb-label-category">Category</span>
      <span class="tb-value" id="tb-category"></span>
    </div>
    <div class="tb-cell">
      <span class="tb-label" id="tb-label-sheet">Sheet No.</span>
      <span class="tb-value" id="tb-sheet"></span>
    </div>
  </div>

  <h2 class="gallery-heading" id="gallery-title">Project Drawings & Renders</h2>
  <div class="image-gallery" id="project-images"></div>

  <div id="custom-lightbox" class="lightbox">
    <span class="close-btn" onclick="closeLightbox()">&times;</span>
    <span class="nav-btn prev-btn" onclick="changeImage(-1)">&#10094;</span>
    <span class="nav-btn next-btn" onclick="changeImage(1)">&#10095;</span>

    <div class="lightbox-content">
      <div class="img-container">
        <img id="lightbox-img" class="lightbox-img" src="" alt="">
      </div>
      <div id="lightbox-caption" class="lightbox-caption"></div>
    </div>
  </div>

  <!-- Central Projects Database Connection Link -->
  <script src="projects.js"></script>
  <script>
    const currentLang = localStorage.getItem('portfolio_lang') || 'en';
    const urlParams = new URLSearchParams(window.location.search);
    const currentProject = PROJECTS_DATA.find(p => p.id === urlParams.get('id'));
    let activeImageIdx = 0;

    // ==========================================================================
    // Blocking Page Loader — waits on the 3D model + every gallery image before
    // letting the user touch/scroll the page. Fixes mobile pull-to-refresh
    // triggering when someone swipes before everything has finished loading.
    // ==========================================================================
    const pageLoader = document.getElementById('page-loader');
    const loaderPercentEl = document.getElementById('loader-percent');
    const loaderBarEl = document.getElementById('loader-bar');
    const loaderLabelEl = document.getElementById('loader-label');

    loaderLabelEl.innerText = currentLang === 'ar' ? 'جارٍ تحميل المشروع' : 'Loading Project';

    // Block swipe/scroll gestures on the overlay itself (the main fix for the
    // mobile "browser refreshes on swipe" issue)
    pageLoader.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

    const loadTasks = {};
    let loaderFinished = false;

    function registerTask(key) { loadTasks[key] = 0; }

    function setTaskProgress(key, value) {
      loadTasks[key] = Math.max(0, Math.min(1, value));
      updateLoaderUI();
    }

    function updateLoaderUI() {
      const keys = Object.keys(loadTasks);
      const overall = keys.length ? keys.reduce((sum, k) => sum + loadTasks[k], 0) / keys.length : 1;
      const pct = Math.min(100, Math.round(overall * 100));
      loaderPercentEl.innerText = pct + '%';
      loaderBarEl.style.width = pct + '%';
      if (pct >= 100) finishLoading();
    }

    function finishLoading() {
      if (loaderFinished) return;
      loaderFinished = true;
      document.body.classList.remove('loading');
      pageLoader.classList.add('hidden');
      setTimeout(() => pageLoader.remove(), 450);
    }

    // Safety net — never let one broken asset hold the page hostage forever
    setTimeout(finishLoading, 15000);

    // Discipline codes, matching the index page's numbering system
    const CATEGORY_META = {
      design:       { code: 'AD', color: '#c9a24b' },
      urban_design: { code: 'UD', color: '#6f92b0' },
      planning:     { code: 'UP', color: '#8a9a6b' },
      executive:    { code: 'ED', color: '#b06a4f' }
    };

    function sheetCodeFor(project) {
      const meta = CATEGORY_META[project.category] || { code: '00' };
      let count = 0;
      for (const p of PROJECTS_DATA) {
        if (p.category === project.category) {
          count++;
          if (p.id === project.id) break;
        }
      }
      return `${meta.code}-${String(count).padStart(2, '0')}`;
    }

    if (currentProject) {
      const isAr = currentLang === 'ar';
      document.documentElement.lang = isAr ? 'ar' : 'en';
      document.body.style.direction = isAr ? 'rtl' : 'ltr';
      document.body.classList.toggle('rtl', isAr);

      const meta = CATEGORY_META[currentProject.category] || { color: '#c9a24b' };
      document.documentElement.style.setProperty('--cat-color', meta.color);

      const sheetCode = sheetCodeFor(currentProject);
      const title = isAr ? currentProject.title_ar : currentProject.title_en;
      const category = isAr ? currentProject.category_ar : currentProject.category_en;

      document.getElementById('back-btn').innerText = isAr ? '→ العودة للمعرض' : '← Back to Portfolio';
      document.getElementById('gallery-title').innerText = isAr ? 'المخططات والرسومات الهندسية' : 'Project Drawings & Renders';
      document.getElementById('viewer-hint').innerText = isAr ? 'اسحب للتدوير، مرر للتكبير.' : 'Drag to rotate, scroll to zoom.';

      document.title = title;
      document.getElementById('project-code').innerText = sheetCode;
      document.getElementById('project-category').innerText = category;
      document.getElementById('project-title').innerText = title;
      document.getElementById('project-desc').innerText = isAr ? currentProject.description_ar : currentProject.description_en;

      document.getElementById('tb-label-project').innerText = isAr ? 'المشروع' : 'Project';
      document.getElementById('tb-label-category').innerText = isAr ? 'التصنيف' : 'Category';
      document.getElementById('tb-label-sheet').innerText = isAr ? 'رقم اللوحة' : 'Sheet No.';
      document.getElementById('tb-project').innerText = title;
      document.getElementById('tb-category').innerText = category;
      document.getElementById('tb-sheet').innerText = sheetCode;

      // Inject model-viewer with custom white linework post processing effects mapping —
      // or, when the project has no model, show a professional explanatory note instead.
      if (currentProject.model) {
        registerTask('model');
        document.getElementById('viewer-container').insertAdjacentHTML('afterbegin', `
          <model-viewer src="${currentProject.model}" auto-rotate camera-controls exposure="1" shadow-intensity="10" shadow-softness="0" environment-image="neutral" camera-orbit="305deg 75deg 10%" interaction-prompt="none" max-camera-orbit="auto 90deg auto">
            <effect-composer>
              <outline-effect color="#ffffff" strength="2.0" smoothing="0"></outline-effect>
            </effect-composer>
          </model-viewer>
        `);
        const modelViewerEl = document.querySelector('#viewer-container model-viewer');
        modelViewerEl.addEventListener('progress', e => setTaskProgress('model', e.detail.totalProgress));
        modelViewerEl.addEventListener('load', () => setTaskProgress('model', 1));
        modelViewerEl.addEventListener('error', () => setTaskProgress('model', 1));
      } else {
        document.getElementById('viewer-hint').style.display = 'none';
        const placeholder = document.createElement('div');
        placeholder.className = 'viewer-placeholder';
        placeholder.innerText = isAr
          ? 'تعذّر إدراج نموذج ثلاثي الأبعاد لهذا المشروع، نظراً لأن حجم الملف الأصلي يتجاوز الحد العملي المناسب للعرض عبر الويب.'
          : "A 3D model isn't available for this project, as the original file size exceeds a practical limit for web delivery.";
        document.getElementById('viewer-container').prepend(placeholder);
      }

      const galleryContainer = document.getElementById('project-images');
      if (currentProject.images) {
        currentProject.images.forEach((img, idx) => {
          const caption = isAr ? img.caption_ar : img.caption_en;
          const taskKey = 'img' + idx;
          registerTask(taskKey);

          const item = document.createElement('div');
          item.className = 'gallery-item';
          item.addEventListener('click', () => openLightbox(idx));

          const imageEl = document.createElement('img');
          imageEl.alt = caption;
          // Attach the load/error listeners BEFORE setting src so a
          // cache-instant load can never be missed.
          imageEl.addEventListener('load', () => setTaskProgress(taskKey, 1));
          imageEl.addEventListener('error', () => setTaskProgress(taskKey, 1));

          const c1 = document.createElement('span'); c1.className = 'corner corner-tl';
          const c2 = document.createElement('span'); c2.className = 'corner corner-tr';
          const c3 = document.createElement('span'); c3.className = 'corner corner-bl';
          const c4 = document.createElement('span'); c4.className = 'corner corner-br';

          const captionEl = document.createElement('div');
          captionEl.className = 'image-caption';
          captionEl.innerText = caption;

          item.append(imageEl, c1, c2, c3, c4, captionEl);
          galleryContainer.appendChild(item);

          imageEl.src = img.url;
        });
      }

      updateLoaderUI();
    } else {
      document.getElementById('title-block').style.display = 'none';
      document.getElementById('project-title').innerText = "Project Not Found / لم يتم العثور على المشروع";
      finishLoading();
    }

    // ==========================================================================
    // Lightbox, Global Full-Window Wheel Zoom & Drag Panning Engine
    // ==========================================================================
    let isDragging = false;
    let startX = 0, startY = 0;
    let panX = 0, panY = 0;
    let currentScale = 1;

    function openLightbox(idx) {
      activeImageIdx = idx;
      resetZoom();
      updateLightbox();
      document.getElementById('custom-lightbox').style.display = 'flex';
    }

    function closeLightbox() {
      document.getElementById('custom-lightbox').style.display = 'none';
    }

    function changeImage(dir) {
      resetZoom();
      activeImageIdx = (activeImageIdx + dir + currentProject.images.length) % currentProject.images.length;
      updateLightbox();
    }

    function updateLightbox() {
      const img = currentProject.images[activeImageIdx];
      document.getElementById('lightbox-img').src = img.url;
      document.getElementById('lightbox-caption').innerText = currentLang === 'ar' ? img.caption_ar : img.caption_en;
    }

    function resetZoom() {
      currentScale = 1;
      panX = 0;
      panY = 0;
      applyTransform();
    }

    function applyTransform() {
      const img = document.getElementById('lightbox-img');
      img.style.transform = `scale(${currentScale}) translate(${panX}px, ${panY}px)`;
    }

    const masterLightbox = document.getElementById('custom-lightbox');
    const imgEl = document.getElementById('lightbox-img');

    // MOUSE CURSOR POSITION-TARGETED ZOOM
    masterLightbox.addEventListener('wheel', function(e) {
      e.preventDefault();

      const oldScale = currentScale;

      if (e.deltaY < 0) {
        currentScale += 0.25; // Scroll Up: Zoom In
      } else {
        currentScale -= 0.25; // Scroll Down: Zoom Out
      }

      currentScale = Math.min(Math.max(1, currentScale), 20);

      if (currentScale === 1) {
        panX = 0;
        panY = 0;
      } else {
        const mouseX = e.clientX;
        const mouseY = e.clientY;

        const rect = imgEl.getBoundingClientRect();

        const imgCenterX = rect.left + rect.width / 2 - (panX * oldScale);
        const imgCenterY = rect.top + rect.height / 2 - (panY * oldScale);

        panX = (mouseX - imgCenterX) / currentScale - (mouseX - imgCenterX) / oldScale + panX;
        panY = (mouseY - imgCenterY) / currentScale - (mouseY - imgCenterY) / oldScale + panY;
      }

      applyTransform();
    }, { passive: false });

    // Clicking and dragging anywhere on the dark backdrop moves the wide blueprint
    masterLightbox.addEventListener('mousedown', function(e) {
      if (e.target.classList.contains('nav-btn') || e.target.classList.contains('close-btn') || e.target.classList.contains('lightbox-caption')) return;
      if (currentScale <= 1) return;

      isDragging = true;
      masterLightbox.style.cursor = 'grabbing';
      imgEl.style.cursor = 'grabbing';
      imgEl.style.transition = 'none';

      startX = e.clientX - panX * currentScale;
      startY = e.clientY - panY * currentScale;
      e.preventDefault();
    });

    window.addEventListener('mousemove', function(e) {
      if (!isDragging) return;

      panX = (e.clientX - startX) / currentScale;
      panY = (e.clientY - startY) / currentScale;

      applyTransform();
    });

    window.addEventListener('mouseup', function() {
      if (isDragging) {
        isDragging = false;
        masterLightbox.style.cursor = 'default';
        imgEl.style.cursor = 'grab';
        imgEl.style.transition = 'transform 0.15s ease-out';
      }
    });

    window.addEventListener('mouseleave', function() {
      if (isDragging) {
        isDragging = false;
        masterLightbox.style.cursor = 'default';
        imgEl.style.cursor = 'grab';
        imgEl.style.transition = 'transform 0.15s ease-out';
      }
    });

    masterLightbox.addEventListener('click', function(e) {
      if (e.target === this || e.target.classList.contains('img-container') || e.target.classList.contains('lightbox-content')) {
        closeLightbox();
      }
    });

    window.addEventListener('keydown', function(e) {
      if (masterLightbox.style.display === 'flex') {
        if (e.key === 'ArrowRight') changeImage(currentLang === 'ar' ? -1 : 1);
        if (e.key === 'ArrowLeft') changeImage(currentLang === 'ar' ? 1 : -1);
        if (e.key === 'Escape') closeLightbox();
      }
    });
  </script>
</body>
</html>
