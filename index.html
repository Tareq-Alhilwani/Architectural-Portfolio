<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Architectural Design Studio Portfolio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #121210;
      --grid-line: rgba(201, 162, 75, 0.035);
      --surface: #191915;
      --line: #29291f;
      --line-strong: #3c3b2e;
      --paper: #ece7dc;
      --paper-dim: #9a9689;
      --paper-faint: #6c6a5f;

      /* discipline codes, echoing how drawing sets colour-code trades */
      --design: #c9a24b;
      --urban-design: #6f92b0;
      --planning: #8a9a6b;
      --executive: #b06a4f;
    }

    html[lang="ar"] body,
    body.rtl {
      font-family: "IBM Plex Sans Arabic", "IBM Plex Sans", sans-serif;
    }

    body {
      font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--paper);
      padding: 6% 8% 10%;
      background-image:
        linear-gradient(var(--grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
      background-size: 48px 48px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 24px;
      margin-bottom: 72px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 28px;
    }

    @media (max-width: 600px) {
      header { flex-direction: column; align-items: flex-start; gap: 18px; }
      .header-actions { order: -1; align-self: flex-end; }
      body.rtl .header-actions { align-self: flex-start; }
    }

    .header-actions { flex-shrink: 0; display: flex; align-items: center; gap: 16px; }

    .pdf-btn {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      border: 1px solid var(--line-strong);
      color: var(--paper-dim);
      text-decoration: none;
      padding: 9px 16px;
      font-family: inherit;
      font-size: 0.82rem;
      letter-spacing: 0.02em;
      white-space: nowrap;
      transition: color 0.2s ease, border-color 0.2s ease;
    }
    .pdf-btn:hover { color: var(--design); border-color: var(--design); }
    .pdf-btn svg { width: 13px; height: 13px; flex-shrink: 0; }

    .header-text h1 {
      font-size: clamp(1.9rem, 3.6vw, 2.6rem);
      font-weight: 300;
      letter-spacing: 0.01em;
      color: #fff;
      line-height: 1.2;
    }
    .header-text p {
      color: var(--paper-dim);
      margin-top: 8px;
      font-size: 0.95rem;
    }

    .lang-btn {
      background: none;
      border: none;
      border-bottom: 1px solid var(--line-strong);
      color: var(--paper-dim);
      padding: 6px 1px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.85rem;
      letter-spacing: 0.02em;
      transition: color 0.2s ease, border-color 0.2s ease;
    }
    .lang-btn:hover { color: var(--design); border-color: var(--design); }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 8px 48px;
      row-gap: 56px;
    }

    .project-card {
      background: var(--surface);
      border: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.25s ease, transform 0.25s ease;
    }
    .project-card:hover {
      border-color: var(--cat-color, var(--design));
      transform: translateY(-3px);
    }

    .card-thumb {
      position: relative;
      width: 100%;
      height: 220px;
      overflow: hidden;
      background: #1f1f19;
    }
    .card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .corner {
      position: absolute;
      width: 16px;
      height: 16px;
      opacity: 0;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }
    .corner-tl { top: 8px; left: 8px; border-top: 2px solid var(--cat-color, var(--design)); border-left: 2px solid var(--cat-color, var(--design)); transform: translate(4px, 4px); }
    .corner-tr { top: 8px; right: 8px; border-top: 2px solid var(--cat-color, var(--design)); border-right: 2px solid var(--cat-color, var(--design)); transform: translate(-4px, 4px); }
    .corner-bl { bottom: 8px; left: 8px; border-bottom: 2px solid var(--cat-color, var(--design)); border-left: 2px solid var(--cat-color, var(--design)); transform: translate(4px, -4px); }
    .corner-br { bottom: 8px; right: 8px; border-bottom: 2px solid var(--cat-color, var(--design)); border-right: 2px solid var(--cat-color, var(--design)); transform: translate(-4px, -4px); }
    .project-card:hover .corner { opacity: 1; transform: translate(0, 0); }

    .card-info {
      padding: 20px 22px 24px;
      flex-grow: 1;
    }
    .card-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .card-code {
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--cat-color, var(--design));
    }
    .card-cat {
      font-size: 0.78rem;
      color: var(--paper-dim);
    }
    .card-info h2 {
      font-size: 1.25rem;
      font-weight: 400;
      margin-bottom: 8px;
      color: #fff;
    }
    .card-info p {
      color: var(--paper-dim);
      font-size: 0.93rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-text">
      <h1 id="studio-title">Architectural Design Studio</h1>
      <p id="studio-tagline">Interactive 3D Portfolio & Spatial Archive</p>
    </div>
    <div class="header-actions">
      <a id="pdf-download-btn" class="pdf-btn" href="portfolio.pdf" download>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 19h16"/></svg>
        <span id="pdf-btn-label">Download Portfolio (PDF)</span>
      </a>
      <button id="lang-toggle-btn" class="lang-btn" onclick="toggleLanguage()">العربية</button>
    </div>
  </header>

  <main>
    <div class="grid-container" id="portfolio-grid"></div>
  </main>

  <!-- Central Projects Database -->
  <script src="projects.js"></script>
  <script>
    let currentLang = localStorage.getItem('portfolio_lang') || 'en';

    // Discipline codes, mirroring how real drawing sets colour- and letter-code trades (A, C, S...)
    const CATEGORY_META = {
      design:       { code: 'AD', color: 'var(--design)' },
      urban_design: { code: 'UD', color: 'var(--urban-design)' },
      planning:     { code: 'UP', color: 'var(--planning)' },
      executive:    { code: 'ED', color: 'var(--executive)' }
    };

    function updatePageStrings() {
      const isAr = currentLang === 'ar';

      document.body.style.direction = isAr ? 'rtl' : 'ltr';
      document.body.classList.toggle('rtl', isAr);
      document.documentElement.lang = isAr ? 'ar' : 'en';
      document.getElementById('studio-title').innerText = isAr ? 'استوديو التصميم المعماري' : 'Architectural Design Studio';
      document.getElementById('studio-tagline').innerText = isAr ? 'معرض أعمال ثلاثي أبعاد تفاعلي وأرشيف مكاني' : 'Interactive 3D Portfolio & Spatial Archive';
      document.getElementById('lang-toggle-btn').innerText = isAr ? 'English' : 'العربية';
      document.getElementById('pdf-btn-label').innerText = isAr ? 'تحميل المعرض (PDF)' : 'Download Portfolio (PDF)';

      renderGrid();
    }

    function toggleLanguage() {
      currentLang = currentLang === 'en' ? 'ar' : 'en';
      localStorage.setItem('portfolio_lang', currentLang);
      updatePageStrings();
    }

    function renderGrid() {
      const gridContainer = document.getElementById('portfolio-grid');
      gridContainer.innerHTML = '';

      if (typeof PROJECTS_DATA === 'undefined') return;

      // running count per discipline, so each project gets a sheet number like AD-01
      const seen = {};

      PROJECTS_DATA.forEach(project => {
        const title = currentLang === 'ar' ? project.title_ar : project.title_en;
        const description = currentLang === 'ar' ? project.description_ar : project.description_en;
        const category = currentLang === 'ar' ? project.category_ar : project.category_en;

        const meta = CATEGORY_META[project.category] || { code: '00', color: 'var(--design)' };
        seen[project.category] = (seen[project.category] || 0) + 1;
        const sheetCode = `${meta.code}-${String(seen[project.category]).padStart(2, '0')}`;

        const card = document.createElement('a');
        card.href = `project.html?id=${project.id}`;
        card.className = 'project-card';
        card.style.setProperty('--cat-color', meta.color);
        card.innerHTML = `
          <div class="card-thumb">
            <img src="${project.thumbnail}" alt="${title}" loading="lazy">
            <span class="corner corner-tl"></span>
            <span class="corner corner-tr"></span>
            <span class="corner corner-bl"></span>
            <span class="corner corner-br"></span>
          </div>
          <div class="card-info">
            <div class="card-meta">
              <span class="card-code">${sheetCode}</span>
              <span class="card-cat">${category}</span>
            </div>
            <h2>${title}</h2>
            <p>${description}</p>
          </div>
        `;
        gridContainer.appendChild(card);
      });
    }

    updatePageStrings();
  </script>
</body>
</html>
